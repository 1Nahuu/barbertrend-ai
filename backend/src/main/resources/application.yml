# ==========================================================================
# Configuración común a todos los perfiles.
#
# Spring Boot lee el archivo .env de la raíz del proyecto con la línea
# "spring.config.import" de más abajo. "optional:" hace que la aplicación
# arranque igual si el archivo no existe, que es lo que pasa en producción
# (donde las variables llegan del servidor, no de un archivo).
# ==========================================================================

spring:
  application:
    name: barbertrend
  config:
    import: "optional:file:.env[.properties]"
  # Correo saliente para avisarle al barbero de cada turno nuevo.
  # En desarrollo se recomienda el SMTP gratuito de Gmail con una
  # "contraseña de aplicación" (ver .env.example). Si MAIL_ENABLED=false,
  # la aplicación no envía: escribe el aviso en el log (modo dry-run).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    problemdetails:
      # Los errores se resuelven con un formato propio y uniforme
      # (ver common/GlobalExceptionHandler y docs/api.md).
      enabled: false
  # Hibernate NUNCA modifica el esquema. Eso es trabajo de Flyway.
  jpa:
    hibernate:
      ddl-auto: none
    # Sin esta propiedad, Hibernate deja la sesión abierta durante el render
    # y las consultas se ejecutan fuera de una transacción.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Las fechas y horas de la agenda se guardan como hora LOCAL de la
          # barbería (ver V1__crear_esquema.sql). Si acá se pone UTC, Hibernate
          # interpreta esa hora local como UTC y en Argentina (UTC-3) la lee
          # 3 horas antes: 09:00 termina mostrándose como 06:00.
          time_zone: ${APP_TIMEZONE:America/Argentina/Buenos_Aires}

server:
  port: 8080
  error:
    # Nunca se muestra el detalle de una excepción al navegador.
    include-message: never
    include-stacktrace: never

# Reglas de la agenda.
# Los valores vienen de .env; estos son los de respaldo.
app:
  timezone: ${APP_TIMEZONE:America/Argentina/Buenos_Aires}
  currency: ${APP_CURRENCY:ARS}
  slot-minutes: ${APP_SLOT_MINUTES:30}
  min-lead-minutes: ${APP_MIN_LEAD_MINUTES:120}
  max-advance-days: ${APP_MAX_ADVANCE_DAYS:60}
  # URL base para los enlaces del código de reserva.
  # En producción tiene que ser el dominio real.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  # Datos que se usan en los avisos (email y mensajes de WhatsApp).
  business-name: ${APP_BUSINESS_NAME:Doble S Barbería}
  address: ${APP_ADDRESS:Bolívar 3008}
  # Usuario del panel del dueño. La contraseña se lee en SecurityConfig
  # desde ADMIN_PASSWORD_HASH (o ADMIN_PASSWORD, solo en desarrollo).
  admin-username: ${ADMIN_USERNAME:admin}
  # Avisos por email al barbero cuando entra un turno nuevo.
  # email-enabled=false deja el sistema en modo dry-run: no envía nada,
  # solo escribe el aviso en el log.
  notifications:
    email-enabled: ${MAIL_ENABLED:false}
    barber-email: ${BARBER_EMAIL:}
    barber-whatsapp: ${BARBER_WHATSAPP:}
    from: ${MAIL_FROM:}

# Registro de logs.
logging:
  level:
    root: INFO
    com.barbertrend: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # Solo "health" queda expuesto. El resto se deshabilita.
        include: health
  endpoint:
    health:
      show-details: never
