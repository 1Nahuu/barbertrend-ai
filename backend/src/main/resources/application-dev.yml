# Perfil de desarrollo.
#
# Se activa con:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Usa H2 en archivo: no hay que instalar ninguna base de datos y los datos
# sobreviven al reinicio del servidor.
#
# El archivo de la base queda en el directorio del proyecto y está en
# .gitignore (patrón *.mv.db).

spring:
  datasource:
    url: jdbc:h2:file:./barbertrend-local/db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true

logging:
  level:
    com.barbertrend: DEBUG
