<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar — Panel del barbero · Doble S Barbería</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#141414">

    <link rel="icon" type="image/png" sizes="any"
          href="/assets/img/logo-doble-s.png">

    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">

<main class="login-page">
    <section class="login-card" aria-labelledby="login-title">

        <a class="login-brand" href="/" aria-label="Volver al sitio de Doble S Barbería">
            <img src="/assets/img/logo-doble-s.png"
                 alt=""
                 width="315" height="320"
                 decoding="async">

            <span class="login-brand-text">
                <span class="login-brand-name">Doble S Barbería</span>
                <span class="login-brand-sub">Panel del barbero</span>
            </span>
        </a>

        <h1 class="login-title" id="login-title">Ingresar</h1>
        <p class="login-text">
            Acceso exclusivo para el barbero. La sesión queda abierta en este
            navegador hasta que cierres sesión o cierres el navegador.
        </p>

        <!-- Mensajes de error o de sesión cerrada. -->
        <div class="form-status" id="login-status" role="status" aria-live="polite"></div>

        <form class="login-form" id="login-form" method="post" action="/login" novalidate>
            <!-- El token lo completa admin-login.js desde la cookie CSRF. -->
            <input type="hidden" name="_csrf" id="csrf-token" value="">

            <div class="field">
                <label class="label" for="username">Usuario</label>
                <input class="input" type="text"
                       id="username" name="username"
                       required autocomplete="username"
                       autocapitalize="none" spellcheck="false"
                       aria-describedby="username-error">
                <p class="field-error" id="username-error" role="alert"></p>
            </div>

            <div class="field">
                <label class="label" for="password">Contraseña</label>
                <input class="input" type="password"
                       id="password" name="password"
                       required autocomplete="current-password"
                       aria-describedby="password-error">
                <p class="field-error" id="password-error" role="alert"></p>
            </div>

            <button class="btn btn-primary btn-lg btn-block"
                    type="submit" id="login-submit">
                <span class="btn-label">Ingresar</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>
        </form>

        <p class="login-back">
            <a href="/">Volver al sitio</a>
        </p>

    </section>
</main>

<script src="/assets/js/admin-login.js"></script>

</body>
</html>
